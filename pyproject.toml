[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lob-modelling"
version = "0.2.0"
description = "Limit order book simulator driven by a bivariate Hawkes process, with MLE calibration"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Matthieu Briche" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]

[project.scripts]
lob-modelling = "lob_modelling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: statistical tests on long simulations"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["RUF001", "RUF002", "RUF003"]
